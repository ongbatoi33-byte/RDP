name: Windows-Dev-Environment

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Link trực tiếp TLauncher (exe hoặc jar)'
        required: false
        default: 'https://tlauncher.org/jar' # Mặc định tải bản .jar cho nhẹ

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 # Giới hạn 6 tiếng để tránh bị GitHub quét lạm dụng

    steps:
      - name: 1. Cấu hình Windows & User
        run: |
          # Bật RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          
          # Tạo User
          $username = "RDP"
          $password = "${{ secrets.RDP_PASSWORD }}"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) { Remove-LocalUser -Name $username }
          New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Restart-Service -Name TermService -Force

      - name: 2. Tải & Cấu hình Mesa3D (Sửa lỗi OpenGL)
        run: |
          $mesaUrl = "https://github.com/pal1000/mesa-dist-win/releases/download/23.1.3/mesa3d-23.1.3-release-msvc.7z"
          $zipPath = "$env:TEMP\mesa3d.7z"
          $extractPath = "$env:TEMP\mesa"
          
          # Tải Mesa3D
          Invoke-WebRequest -Uri $mesaUrl -OutFile $zipPath -UseBasicParsing
          
          # Giải nén lấy file opengl32.dll
          & "7z.exe" x $zipPath "-o$extractPath" -y
          
          # Copy ra Desktop để bạn dễ tìm và copy vào thư mục Game/Java
          if (!(Test-Path "C:\Users\RDP\Desktop")) { New-Item -ItemType Directory -Path "C:\Users\RDP\Desktop" -Force }
          Copy-Item "$extractPath\x64\opengl32.dll" -Destination "C:\Users\RDP\Desktop\opengl32.dll"
          Write-Host "File opengl32.dll da san sang tai Desktop."

      - name: 3. Tải TLauncher
        run: |
          $tlUrl = "${{ github.event.inputs.target_url }}"
          $outPath = "C:\Users\RDP\Desktop\TLauncher.jar"
          Invoke-WebRequest -Uri $tlUrl -OutFile $outPath -UseBasicParsing
          Write-Host "Da tai TLauncher vao Desktop."

      - name: 4. Cài đặt & Kết nối Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          
          # Đăng nhập Tailscale
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-win
          
          $tsIP = ""
          for ($i=0; $i -lt 12; $i++) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              if ($tsIP) { break }
              Start-Sleep -Seconds 5
          }
          echo "TS_IP=$tsIP" >> $env:GITHUB_ENV

      - name: 5. Tạo Shortcut tự động mở
        run: |
          $username = "RDP"
          $startupPath = "C:\Users\$username\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          if (!(Test-Path $startupPath)) { New-Item -ItemType Directory -Path $startupPath -Force }
          
          $WshShell = New-Object -ComObject WScript.Shell
          $Shortcut = $WshShell.CreateShortcut("$startupPath\OpenTLauncher.lnk")
          $Shortcut.TargetPath = "C:\Users\RDP\Desktop\TLauncher.jar"
          $Shortcut.Save()

      - name: 6. Thông tin kết nối
        run: |
          Write-Host "`n"
          Write-Host "############################################################" -ForegroundColor Cyan
          Write-Host "   KET NOI RDP QUA TAILSCALE IP: $env:TS_IP" -ForegroundColor Yellow
          Write-Host "   USER: RDP | PASS: ${{ secrets.RDP_PASSWORD }}" -ForegroundColor Green
          Write-Host "############################################################" -ForegroundColor Cyan
          
          # Giữ runner sống
          while ($true) {
              $time = Get-Date -Format "HH:mm:ss"
              Write-Host "[$time] Runner dang online tai IP: $env:TS_IP"
              Start-Sleep -Seconds 300
          }
